# Рендерит PlantUML-диаграммы (.puml) в PNG прямо в GitHub.
# Использует официальный Docker-образ plantuml/plantuml.
# Срабатывает при изменении файлов в docs/ba/diagrams/, генерирует .png рядом
# с исходником и коммитит результат.
name: Render PlantUML

on:
  push:
    paths:
      - 'docs/ba/diagrams/**'
  workflow_dispatch: {}

jobs:
  plantuml:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make diagrams writable
        run: sudo chmod -R a+rwX docs/ba/diagrams

      - name: PlantUML render
        uses: docker://plantuml/plantuml:latest
        with:
          args: '-v -tpng -o /github/workspace/docs/ba/diagrams /github/workspace/docs/ba/diagrams'

      - name: Commit rendered diagrams
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ba/diagrams/
          git diff --cached --quiet || git commit -m 'Render PlantUML diagrams to PNG'
          git push